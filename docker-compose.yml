version: "3.9"

networks:
  btms-net:
    driver: bridge

services:
  # ─────────────────────────────────────────────
  # Phase 1: Message Broker (Apache Kafka, KRaft mode — no Zookeeper)
  # ─────────────────────────────────────────────
  message-broker:
    image: apache/kafka:3.8.0
    container_name: message-broker
    ports:
      - "9092:9092"
    networks:
      - btms-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://message-broker:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@message-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 600000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────  # ─────────────────────────────────────────────
  # Authentication & User Management (FastAPI + SQLite)
  # ─────────────────────────────────────────────
  auth-service:
    build: ./auth_service
    container_name: auth-service
    ports:
      - "9000:9000"
    networks:
      - btms-net
    volumes:
      - auth-data:/data
    environment:
      - DB_PATH=/data/btms_users.db
      - JWT_SECRET=btms-super-secret-key-change-in-prod-2026

  # Phase 3: Data Ingestion Service (Flask)
  # ─────────────────────────────────────────────
  ingestion-service:
    build: ./ingestion
    container_name: ingestion-service
    ports:
      - "5001:5000"  # 5000 is taken by macOS AirPlay Receiver
    networks:
      - btms-net
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=message-broker:19092
      - KAFKA_TOPIC=battery_stream

  # ─────────────────────────────────────────────
  # Phase 4: AI Optimization Engine (FastAPI)
  # ─────────────────────────────────────────────
  ai-engine:
    build: ./ai_engine
    container_name: ai-engine
    ports:
      - "8000:8000"
    networks:
      - btms-net
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=message-broker:19092
      - KAFKA_TOPIC=battery_stream
      - KAFKA_GROUP_ID=btms-ai-engine

  # ─────────────────────────────────────────────
  # Big Data: Spark Structured Streaming (Kafka → Parquet data lake)
  # ─────────────────────────────────────────────
  spark-streaming:
    build: ./analytics
    container_name: spark-streaming
    command: ["python", "spark_job.py"]
    networks:
      - btms-net
    depends_on:
      message-broker:
        condition: service_healthy
    volumes:
      - lake-data:/data/lake
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=message-broker:19092
      - KAFKA_TOPIC=battery_stream
      - LAKE_PATH=/data/lake
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Big Data: Analytics API (pandas + PyArrow over the data lake)
  # ─────────────────────────────────────────────
  analytics-api:
    build: ./analytics
    container_name: analytics-api
    ports:
      - "8100:8100"
    networks:
      - btms-net
    volumes:
      - lake-data:/data/lake:ro
    environment:
      - LAKE_PATH=/data/lake

  # ─────────────────────────────────────────────
  # Phase 2: Sensor Simulation Engine
  # ─────────────────────────────────────────────
  simulator:
    build: ./simulator
    container_name: simulator
    networks:
      - btms-net
    depends_on:
      - ingestion-service
    environment:
      - INGESTION_URL=http://ingestion-service:5000/telemetry  # internal Docker port stays 5000

  # ─────────────────────────────────────────────
  # Phase 5: React Digital Twin Dashboard
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_AI_ENGINE_URL: ""   # empty = use /api prefix proxied by Nginx
    container_name: dashboard
    ports:
      - "3000:80"
    networks:
      - btms-net
    depends_on:
      - ai-engine
      - auth-service
      - analytics-api

  # ─────────────────────────────────────────────
  # Event-driven: Alert Service (consumes btms_alerts → SQLite + REST)
  # ─────────────────────────────────────────────
  alert-service:
    build: ./alert_service
    container_name: alert-service
    ports:
      - "8200:8200"
    networks:
      - btms-net
    depends_on:
      message-broker:
        condition: service_healthy
    volumes:
      - alert-data:/data
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=message-broker:19092
      - KAFKA_ALERTS_TOPIC=btms_alerts
      - DB_PATH=/data/alerts.db
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Kafka UI: browse topics, partitions, consumer groups and lag
  # ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    networks:
      - btms-net
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=btms
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=message-broker:19092

volumes:
  auth-data:
  lake-data:
  alert-data:
